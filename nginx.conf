server {
    listen 80;
    server_name localhost peakloads-web peakloads.com;

    # Sürüm bilgilerini (Server: nginx/x.x.x) HTTP yanıt başlıklarından gizle (Information Disclosure koruması)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Buffer & Gövde boyutu sınırları (DoS / Buffer Overflow saldırılarına karşı koruma)
    client_max_body_size 1m;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Yalnızca geçerli HTTP metotlarına izin ver (Statik SPA için güvenli liste)
    if ($request_method !~ ^(GET|HEAD|POST)$ ) {
        return 405;
    }

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Güvenlik Başlıkları (Hardening Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.ahrefs.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://www.clarity.ms https://c.clarity.ms; connect-src 'self' https://analytics.ahrefs.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://www.clarity.ms;" always;

    # Gizli dosyalara (.git, .env, .vscode vb.) ve dizinlere erişimi tamamen engelle
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Service Worker için önbellek kontrolü (anında güncelleme alabilmesi için)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Statik varlıklar (CSS, JS, İkonlar) için güvenli önbellekleme
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Eski araç URL'lerini kalıcı olarak anasayfaya yönlendir
    location ~ ^/(squat-1rm-calculator|advanced-1rm-estimator|bench-press-warm-up-planner|squat-warm-up-planner|deadlift-warm-up-planner|rpe-rir-translator)/?$ {
        return 301 https://peakloads.com/;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Özel 404 Hata Sayfası
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}
